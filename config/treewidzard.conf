# TreeWidzard Configuration File
# This file contains default settings for TreeWidzard system

# System Configuration
[system]
default_thread_count = 8
max_memory_mb = 8192
temp_directory = "/tmp/treewidzard"
log_level = "INFO"  # DEBUG, INFO, WARNING, ERROR

# Search Strategy Configuration
[search]
default_strategy = "ParallelBreadthFirstSearch"
timeout_seconds = 3600
use_isomorphism_reduction = true
parallel_enabled = true

# Dynamic Programming Configuration
[dp]
default_width_type = "tw"  # tw (treewidth) or pw (pathwidth)
max_width = 20
core_directories = ["./DPCores", "/usr/local/lib/treewidzard/cores"]
cache_enabled = true

# Output Configuration
[output]
default_format = "PACE"  # PACE, ITD, GML, DOT
verbose_mode = false
save_witnesses = true
output_directory = "./output"

# Debug Configuration  
[debug]
enable_profiling = false
save_intermediate_results = false
validate_inputs = true

# Core-specific configurations
[cores]
chromatic_number_optimization = true
independent_set_heuristics = "greedy"
max_degree_fast_check = true

# Cluster/Parallel Configuration
[cluster]
slurm_enabled = false
slurm_partition = "normal"
slurm_account = ""
max_nodes = 1
tasks_per_node = 32

# Performance Tuning
[performance]
hash_table_size = 1048576
state_cache_size = 10000
witness_compression = true
memory_pool_enabled = true

# File Paths
[paths]
examples_directory = "./system-paper"
test_cases_directory = "./test_conjectures"
documentation_directory = "./docs"
benchmark_directory = "./benchmarks"