name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive_name: treewidzard-linux.tar.gz
          - os: macos-latest
            platform: macos
            archive_name: treewidzard-macos.tar.gz
          - os: windows-latest
            platform: windows
            archive_name: treewidzard-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure package build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/treewidzard"

      - name: Configure package build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build-release -G Ninja \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/treewidzard"

      - name: Build package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build build-release -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Build package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build-release -j "$(nproc)"

      - name: Install package tree (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --install build-release

      - name: Install package tree (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --install build-release

      - name: Bundle Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          runtime_dir="$PWD/treewidzard/libexec/treewidzard"
          deps_file="$PWD/windows-runtime-deps.txt"
          : > "$deps_file"

          ldd "$runtime_dir/treewidzard.exe" | awk '/=> \// { print $3 }' >> "$deps_file"
          find "$runtime_dir/DPCores" "$runtime_dir/SearchStrategies" -name '*.dll' -print0 |
          while IFS= read -r -d '' dll; do
            ldd "$dll" | awk '/=> \// { print $3 }' >> "$deps_file"
          done

          sort -u "$deps_file" | while IFS= read -r dep; do
            if [ -n "$dep" ]; then
              cp -f "$dep" "$runtime_dir/"
            fi
          done

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive_name }}" treewidzard

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path treewidzard -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: ${{ matrix.archive_name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
