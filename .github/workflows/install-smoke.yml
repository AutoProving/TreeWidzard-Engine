name: Install Smoke

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  install-smoke:
    name: Install Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure install smoke build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-install \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-root"

      - name: Configure install smoke build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build-install -G Ninja \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-root"

      - name: Build install smoke artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build build-install -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Build install smoke artifacts (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build-install -j "$(nproc)"

      - name: Install (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --install build-install

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --install build-install

      - name: Bundle Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          runtime_dir="$PWD/install-root/libexec/treewidzard"
          deps_file="$PWD/windows-runtime-deps.txt"
          : > "$deps_file"

          ldd "$runtime_dir/treewidzard.exe" | awk '/=> \// { print $3 }' >> "$deps_file"
          find "$runtime_dir/DPCores" "$runtime_dir/SearchStrategies" -name '*.dll' -print0 |
          while IFS= read -r -d '' dll; do
            ldd "$dll" | awk '/=> \// { print $3 }' >> "$deps_file"
          done

          sort -u "$deps_file" | while IFS= read -r dep; do
            if [ -n "$dep" ]; then
              cp -f "$dep" "$runtime_dir/"
            fi
          done

      - name: Run installed smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          SMOKE_DIR="$PWD/install-smoke-data"
          mkdir -p "$SMOKE_DIR"
          cat > "$SMOKE_DIR/simple_implies.txt" <<'EOF'
          x := MaxDegree(4)
          y := ChromaticNumber(4)
          Formula
          x IMPLIES y
          EOF

          (
            cd "$SMOKE_DIR"
            "$PWD/../install-root/bin/treewidzard" -atp tw=2 BreadthFirstSearch "$SMOKE_DIR/simple_implies.txt"
          )

      - name: Run installed smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:GITHUB_WORKSPACE 'install-smoke-data'
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          @(
            'x := MaxDegree(4)',
            'y := ChromaticNumber(4)',
            'Formula',
            'x IMPLIES y'
          ) | Set-Content (Join-Path $smokeDir 'simple_implies.txt')

          $launcher = Join-Path $env:GITHUB_WORKSPACE 'install-root\bin\treewidzard.bat'
          Push-Location $smokeDir
          & $launcher -atp tw=2 BreadthFirstSearch (Join-Path $smokeDir 'simple_implies.txt')
          Pop-Location
