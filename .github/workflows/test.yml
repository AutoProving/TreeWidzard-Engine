name: TreeWidzard CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex cmake build-essential
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install bison flex cmake
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build TreeWidzard
      run: cmake --build build -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)
    
    - name: Build Search Strategies
      run: |
        cmake --build build --target BreadthFirstSearch
        cmake --build build --target ParallelBreadthFirstSearch
        cmake --build build --target IsomorphismBreadthFirstSearch
        cmake --build build --target ParallelIsomorphismBreadthFirstSearch
    
    - name: Build Tests
      run: |
        cmake --build build --target unit_tests
        cmake --build build --target integration_tests
        cmake --build build --target run_tests
    
    - name: Run Unit Tests
      run: |
        cd build
        ./unit_tests --gtest_output=xml:unit_test_results.xml
      continue-on-error: true
    
    - name: Run Integration Tests
      run: |
        cd build
        export TREEWIDZARD_SEARCHSTRATEGIES="$(pwd)/SearchStrategies"
        ./integration_tests --gtest_output=xml:integration_test_results.xml
      continue-on-error: true
    
    - name: Run Legacy Tests
      run: |
        cd build
        ./run_tests --gtest_output=xml:legacy_test_results.xml
      continue-on-error: true
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: build/*_test_results.xml
    
    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Build completed on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        if [ -f build/unit_test_results.xml ]; then
          echo "✅ Unit tests executed" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f build/integration_test_results.xml ]; then
          echo "✅ Integration tests executed" >> $GITHUB_STEP_SUMMARY
        fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check for compilation warnings
      run: |
        mkdir -p build
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build 2>&1 | tee build_output.txt
        
        # Count warnings (this is informational, not blocking)
        warning_count=$(grep -c "warning:" build_output.txt || true)
        echo "Found $warning_count warnings"
        echo "## Build Warnings: $warning_count" >> $GITHUB_STEP_SUMMARY
