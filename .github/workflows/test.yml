name: TreeWidzard CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex cmake build-essential
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install bison flex cmake
    
    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build TreeWidzard
      run: cmake --build build -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)
    
    - name: Run CTest
      run: |
        ctest --test-dir build --output-on-failure \
          -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)" \
          --output-junit ctest_results.xml
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          build/ctest_results.xml
          build/Testing/**
    
    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Build completed on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        if [ -f build/ctest_results.xml ]; then
          echo "✅ ctest completed and produced JUnit output" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ ctest did not produce JUnit output" >> $GITHUB_STEP_SUMMARY
        fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex cmake build-essential

    - name: Check for compilation warnings
      run: |
        set -o pipefail
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Werror"
        cmake --build build -j "$(nproc)" 2>&1 | tee build_output.txt

        warning_count=$(grep -c "warning:" build_output.txt || true)
        echo "Found $warning_count warnings"
        echo "## Build Warnings: $warning_count" >> $GITHUB_STEP_SUMMARY
        if [ "$warning_count" -ne 0 ]; then
          echo "Warnings are treated as failures in this job." >&2
          exit 1
        fi
